apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.fitnessPVC.name }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.fitnessPVC.accessMode }}
  storageClassName: {{ .Values.fitnessPVC.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.fitnessPVC.size }}
